id: video-generate
display_name: "视频生成管线"
description: "首尾帧 → MiniMax H3 I2V 视频生成 → 可选的视频质检"
version: "1.0"

steps:
  - id: gen_video
    type: atomic_workflow
    workflow_id: h3-i2v
    description: "基于首帧和尾帧生成关键帧动画视频(含音频)"
    inputs:
      prompt: ${params.prompt}
      first_frame: ${params.first_frame}
      last_frame: ${params.last_frame}
      seed: ${params.seed}
      steps: 20
      cfg: 7.0
      width: 960
      height: 544
      length: 73
      fps: 24
    outputs:
      video: ${outputs[0].localPath}
    retry:
      max: 2
      delay: 2000

outputs:
  primary: ${steps.gen_video.outputs[0]}
  intermediates:
    video_path: ${steps.gen_video.outputs[0]}